  <circle cx="60" cy="225" r="14" fill="#00f2fe" opacity="0.2" />
  <text x="60" y="230" fill="#00f2fe" font-family="'Inter', sans-serif" font-size="14" font-weight="bold" text-anchor="middle">⚡</text>
