<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="100%" height="100%">
  <defs>
    <radialGradient id="blush" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fda4af" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#fda4af" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pugBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F7E1D7"/>
      <stop offset="100%" stop-color="#EED3C4"/>
    </linearGradient>
    <linearGradient id="pugMuzzle" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4A3E3D"/>
      <stop offset="100%" stop-color="#2D2322"/>
    </linearGradient>
    <linearGradient id="roseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FB7185"/>
      <stop offset="100%" stop-color="#E11D48"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#ec4899" flood-opacity="0.15"/>
    </filter>
  </defs>

  <style>
    @keyframes earWiggle {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(4deg); }
    }
    @keyframes blink {
      0%, 90%, 100% { transform: scaleY(1); }
      95% { transform: scaleY(0.1); }
    }
    @keyframes heartFloat {
      0% { transform: translateY(0) scale(0.9); opacity: 0.8; }
      50% { transform: translateY(-8px) scale(1.1); opacity: 1; }
      100% { transform: translateY(0) scale(0.9); opacity: 0.8; }
    }
    .left-ear { transform-origin: 90px 100px; animation: earWiggle 3s ease-in-out infinite; }
    .right-ear { transform-origin: 230px 100px; animation: earWiggle 3s ease-in-out infinite reverse; }
    .eye { transform-origin: 50% 50%; animation: blink 4s infinite; }
    .floating-heart { animation: heartFloat 2.5s ease-in-out infinite; }
  </style>

  <!-- Background Soft Bubble -->
  <circle cx="160" cy="160" r="145" fill="#FFF1F2" filter="url(#softShadow)"/>
  <circle cx="160" cy="160" r="135" fill="#FFE4E6" opacity="0.6"/>

  <!-- Floating Decorative Flowers & Hearts -->
  <g class="floating-heart" transform="translate(45, 60)">
    <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" fill="#FB7185"/>
  </g>
  <g class="floating-heart" transform="translate(255, 75) scale(0.85)">
    <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" fill="#F472B6"/>
  </g>

  <!-- Pug Body / Shoulders -->
  <ellipse cx="160" cy="275" rx="90" ry="60" fill="url(#pugBody)"/>

  <!-- Left Ear (Velvety brown) -->
  <g class="left-ear">
    <path d="M 90 95 C 60 75, 45 125, 75 160 C 88 175, 105 140, 105 115 Z" fill="#3D2E2C"/>
    <path d="M 85 105 C 70 95, 62 125, 80 145 Z" fill="#2E2120" opacity="0.4"/>
  </g>

  <!-- Right Ear -->
  <g class="right-ear">
    <path d="M 230 95 C 260 75, 275 125, 245 160 C 232 175, 215 140, 215 115 Z" fill="#3D2E2C"/>
    <path d="M 235 105 C 250 95, 258 125, 240 145 Z" fill="#2E2120" opacity="0.4"/>
  </g>

  <!-- Head Base -->
  <ellipse cx="160" cy="155" rx="85" ry="78" fill="url(#pugBody)"/>

  <!-- Wrinkles on Forehead -->
  <path d="M 135 105 Q 160 98 185 105" stroke="#D3B8AA" stroke-width="4" stroke-linecap="round" fill="none"/>
  <path d="M 145 92 Q 160 88 175 92" stroke="#D3B8AA" stroke-width="3" stroke-linecap="round" fill="none"/>
  <path d="M 140 120 Q 160 112 180 120" stroke="#D3B8AA" stroke-width="3.5" stroke-linecap="round" fill="none"/>

  <!-- Blush Cheeks -->
  <circle cx="102" cy="190" r="22" fill="url(#blush)"/>
  <circle cx="218" cy="190" r="22" fill="url(#blush)"/>

  <!-- Pug Dark Muzzle Base -->
  <ellipse cx="160" cy="192" rx="55" ry="42" fill="url(#pugMuzzle)"/>

  <!-- Cute Nose -->
  <path d="M 148 172 C 148 168, 172 168, 172 172 C 172 180, 164 186, 160 186 C 156 186, 148 180, 148 172 Z" fill="#1C1413"/>
  <ellipse cx="154" cy="176" rx="2.5" ry="3.5" fill="#3D2E2C"/>
  <ellipse cx="166" cy="176" rx="2.5" ry="3.5" fill="#3D2E2C"/>

  <!-- Mouth & Happy Tongue -->
  <path d="M 160 186 L 160 198" stroke="#1C1413" stroke-width="3"/>
  <path d="M 144 196 Q 160 205 176 196" stroke="#1C1413" stroke-width="3" fill="none"/>
  <!-- Pink Tongue -->
  <path d="M 152 198 Q 160 220 168 198 Z" fill="#FB7185"/>
  <path d="M 160 198 L 160 213" stroke="#F43F5E" stroke-width="1.5"/>

  <!-- Muzzle Whiskers / Dots -->
  <circle cx="132" cy="188" r="1.5" fill="#1C1413"/>
  <circle cx="126" cy="194" r="1.5" fill="#1C1413"/>
  <circle cx="135" cy="198" r="1.5" fill="#1C1413"/>
  <circle cx="188" cy="188" r="1.5" fill="#1C1413"/>
  <circle cx="194" cy="194" r="1.5" fill="#1C1413"/>
  <circle cx="185" cy="198" r="1.5" fill="#1C1413"/>

  <!-- Eyes (Big, liquid, pleading pug eyes) -->
  <g class="eye">
    <!-- Left Eye -->
    <ellipse cx="118" cy="148" rx="18" ry="20" fill="#201514"/>
    <ellipse cx="118" cy="148" rx="15" ry="17" fill="#382421"/>
    <circle cx="113" cy="142" r="7" fill="#FFFFFF"/>
    <circle cx="123" cy="154" r="3.5" fill="#FFFFFF" opacity="0.85"/>
    <circle cx="110" cy="153" r="2" fill="#FFFFFF" opacity="0.6"/>

    <!-- Right Eye -->
    <ellipse cx="202" cy="148" rx="18" ry="20" fill="#201514"/>
    <ellipse cx="202" cy="148" rx="15" ry="17" fill="#382421"/>
    <circle cx="197" cy="142" r="7" fill="#FFFFFF"/>
    <circle cx="207" cy="154" r="3.5" fill="#FFFFFF" opacity="0.85"/>
    <circle cx="194" cy="153" r="2" fill="#FFFFFF" opacity="0.6"/>
  </g>

  <!-- IT Guy Nerdy Glasses! -->
  <g id="glasses">
    <!-- Frame Left -->
    <circle cx="118" cy="148" r="26" fill="rgba(255,255,255,0.18)" stroke="#E11D48" stroke-width="3.5"/>
    <!-- Frame Right -->
    <circle cx="202" cy="148" r="26" fill="rgba(255,255,255,0.18)" stroke="#E11D48" stroke-width="3.5"/>
    <!-- Bridge -->
    <path d="M 144 145 Q 160 138 176 145" stroke="#E11D48" stroke-width="3.5" fill="none"/>
    <!-- Temple tips -->
    <path d="M 92 148 L 76 142" stroke="#E11D48" stroke-width="3" stroke-linecap="round"/>
    <path d="M 228 148 L 244 142" stroke="#E11D48" stroke-width="3" stroke-linecap="round"/>
    <!-- Lens Sheen reflection -->
    <path d="M 104 135 L 122 135" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>
    <path d="M 188 135 L 206 135" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>
  </g>

  <!-- Romantic Rose in mouth! -->
  <g transform="translate(170, 202) rotate(15)">
    <!-- Stem -->
    <path d="M -5 5 Q 25 15 50 12" stroke="#16A34A" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    <!-- Leaf -->
    <path d="M 22 9 Q 32 0 35 12 Z" fill="#22C55E"/>
    <!-- Flower Petals -->
    <circle cx="50" cy="12" r="14" fill="url(#roseGrad)"/>
    <circle cx="48" cy="9" r="9" fill="#F43F5E"/>
    <circle cx="52" cy="14" r="5" fill="#FFE4E6"/>
  </g>

  <!-- Cute Bowtie around neck -->
  <g transform="translate(160, 248)">
    <polygon points="-24,-12 -24,12 0,0" fill="#E11D48"/>
    <polygon points="24,-12 24,12 0,0" fill="#E11D48"/>
    <circle cx="0" cy="0" r="7" fill="#FB7185"/>
    <circle cx="0" cy="0" r="3" fill="#FFF"/>
  </g>

  <!-- Bottom Paw Prints -->
  <g transform="translate(85, 280) scale(0.6)" opacity="0.7">
    <ellipse cx="20" cy="25" rx="14" ry="11" fill="#FB7185"/>
    <circle cx="8" cy="10" r="5" fill="#FB7185"/>
    <circle cx="20" cy="6" r="5.5" fill="#FB7185"/>
    <circle cx="32" cy="10" r="5" fill="#FB7185"/>
  </g>
  <g transform="translate(205, 280) scale(0.6)" opacity="0.7">
    <ellipse cx="20" cy="25" rx="14" ry="11" fill="#FB7185"/>
    <circle cx="8" cy="10" r="5" fill="#FB7185"/>
    <circle cx="20" cy="6" r="5.5" fill="#FB7185"/>
    <circle cx="32" cy="10" r="5" fill="#FB7185"/>
  </g>
</svg>
