<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="ppBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#02182b" />
      <stop offset="100%" stop-color="#010c17" />
    </linearGradient>
    <linearGradient id="neonGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22c55e" />
      <stop offset="100%" stop-color="#15803d" />
    </linearGradient>
    <linearGradient id="cyanP" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
  </defs>

  <rect width="600" height="380" fill="url(#ppBg)" rx="12" />

  <!-- Window Header -->
  <rect width="600" height="42" fill="#042742" rx="12" />
  <rect y="30" width="600" height="12" fill="#042742" />
  <circle cx="25" cy="21" r="5" fill="#ef4444" />
  <circle cx="42" cy="21" r="5" fill="#f59e0b" />
  <circle cx="59" cy="21" r="5" fill="#10b981" />
  <text x="300" y="26" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="12" text-anchor="middle">packetpulse // raw_socket_sniffer.java (Promiscuous Mode)</text>

  <!-- Live Traffic Scope / Oscilloscope Waveform -->
  <rect x="30" y="60" width="540" height="110" rx="8" fill="#021424" stroke="#0369a1" />
  <text x="45" y="80" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="11">ETH0 BANDWIDTH // 1.48 Gbps // PACKETS CAPTURED: 2,491,802</text>
  
  <!-- Waveform line -->
  <path d="M 45 130 Q 75 110, 105 135 T 165 95 T 225 140 T 285 80 T 345 125 T 405 105 T 465 145 T 525 90 L 555 120" fill="none" stroke="#00f2fe" stroke-width="2" />
  <!-- Under waveform glow area -->
  <path d="M 45 130 Q 75 110, 105 135 T 165 95 T 225 140 T 285 80 T 345 125 T 405 105 T 465 145 T 525 90 L 555 120 V 160 H 45 Z" fill="#00f2fe" opacity="0.1" />

  <!-- Protocol Distribution Table -->
  <rect x="30" y="185" width="540" height="115" rx="8" fill="#021424" stroke="#0369a1" />
  
  <!-- Table Header -->
  <rect x="30" y="185" width="540" height="26" fill="#052847" rx="8" />
  <rect x="30" y="200" width="540" height="11" fill="#052847" />
  <text x="45" y="202" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="10.5">ID</text>
  <text x="80" y="202" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="10.5">SOURCE IP</text>
  <text x="180" y="202" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="10.5">DEST IP</text>
  <text x="280" y="202" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="10.5">PROTO</text>
  <text x="340" y="202" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="10.5">PORT</text>
  <text x="400" y="202" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="10.5">LEN</text>
  <text x="460" y="202" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="10.5">INFO / FLAGS</text>

  <!-- Row 1 -->
  <text x="45" y="226" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="10">01</text>
  <text x="80" y="226" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="10">192.168.1.104</text>
  <text x="180" y="226" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="10">10.0.0.1</text>
  <text x="280" y="226" fill="#22c55e" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold">TCP</text>
  <text x="340" y="226" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="10">443</text>
  <text x="400" y="226" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="10">1514</text>
  <text x="460" y="226" fill="#00f2fe" font-family="'JetBrains Mono', monospace" font-size="10">[SYN, ACK] Seq=0 Win=65535</text>

  <!-- Row 2 -->
  <text x="45" y="250" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="10">02</text>
  <text x="80" y="250" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="10">192.168.1.15</text>
  <text x="180" y="250" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="10">8.8.8.8</text>
  <text x="280" y="250" fill="#f59e0b" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold">UDP</text>
  <text x="340" y="250" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="10">53</text>
  <text x="400" y="250" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="10">78</text>
  <text x="460" y="250" fill="#fde68a" font-family="'JetBrains Mono', monospace" font-size="10">Standard query A auth.internal</text>

  <!-- Row 3 -->
  <text x="45" y="274" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="10">03</text>
  <text x="80" y="274" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="10">10.0.4.52</text>
  <text x="180" y="274" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="10">192.168.1.1</text>
  <text x="280" y="274" fill="#ec4899" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold">ICMP</text>
  <text x="340" y="274" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="10">-</text>
  <text x="400" y="274" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="10">98</text>
  <text x="460" y="274" fill="#f472b6" font-family="'JetBrains Mono', monospace" font-size="10">Echo (ping) reply ttl=64</text>

  <!-- Footer Banner -->
  <rect x="30" y="315" width="540" height="38" rx="6" fill="#042742" stroke="#0369a1" />
  <text x="45" y="339" fill="#22c55e" font-family="'JetBrains Mono', monospace" font-size="11">● Listening on en0: Sockets JNI + libpcap native bridge // 0 Dropped Packets</text>
</svg>
