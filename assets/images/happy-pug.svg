<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="100%" height="100%">
  <defs>
    <radialGradient id="blush2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fda4af" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#fda4af" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pugBody2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F7E1D7"/>
      <stop offset="100%" stop-color="#EED3C4"/>
    </linearGradient>
    <linearGradient id="pugMuzzle2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4A3E3D"/>
      <stop offset="100%" stop-color="#2D2322"/>
    </linearGradient>
    <linearGradient id="partyHatGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F43F5E"/>
      <stop offset="50%" stop-color="#EC4899"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <filter id="glow2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#ec4899" flood-opacity="0.2"/>
    </filter>
  </defs>

  <style>
    @keyframes joyfulBounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }
    @keyframes pawWave {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(12deg); }
    }
    @keyframes tearGlint {
      0%, 100% { opacity: 0.6; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.2); }
    }
    .bounce-group { animation: joyfulBounce 1.8s ease-in-out infinite; }
    .left-paw { transform-origin: 65px 230px; animation: pawWave 1.2s ease-in-out infinite; }
    .right-paw { transform-origin: 255px 230px; animation: pawWave 1.2s ease-in-out infinite reverse; }
    .tear { animation: tearGlint 2s infinite ease-in-out; }
  </style>

  <!-- Celebration Aura -->
  <circle cx="160" cy="160" r="145" fill="#FFF1F2" filter="url(#glow2)"/>
  <circle cx="160" cy="160" r="135" fill="#FCE7F3" opacity="0.6"/>

  <!-- Confetti bits -->
  <rect x="50" y="50" width="8" height="14" rx="2" fill="#F43F5E" transform="rotate(25 50 50)"/>
  <rect x="250" y="45" width="9" height="15" rx="2" fill="#8B5CF6" transform="rotate(-30 250 45)"/>
  <rect x="40" y="140" width="8" height="12" rx="2" fill="#FBBF24" transform="rotate(45 40 140)"/>
  <rect x="270" y="130" width="8" height="12" rx="2" fill="#34D399" transform="rotate(-15 270 130)"/>
  <circle cx="80" cy="90" r="5" fill="#EC4899"/>
  <circle cx="230" cy="95" r="5" fill="#F43F5E"/>
  <circle cx="270" cy="200" r="6" fill="#F59E0B"/>
  <circle cx="45" cy="210" r="6" fill="#8B5CF6"/>

  <g class="bounce-group">
    <!-- Pug Body -->
    <ellipse cx="160" cy="280" rx="92" ry="60" fill="url(#pugBody2)"/>

    <!-- Paws Raised In Triumph! -->
    <!-- Left Paw -->
    <g class="left-paw">
      <path d="M 60 250 Q 50 200 70 190 Q 90 185 95 210 Q 100 240 85 260 Z" fill="url(#pugBody2)"/>
      <circle cx="75" cy="192" r="5" fill="#FB7185"/>
      <circle cx="65" cy="198" r="4" fill="#FB7185"/>
      <circle cx="85" cy="198" r="4" fill="#FB7185"/>
    </g>

    <!-- Right Paw -->
    <g class="right-paw">
      <path d="M 260 250 Q 270 200 250 190 Q 230 185 225 210 Q 220 240 235 260 Z" fill="url(#pugBody2)"/>
      <circle cx="245" cy="192" r="5" fill="#FB7185"/>
      <circle cx="255" cy="198" r="4" fill="#FB7185"/>
      <circle cx="235" cy="198" r="4" fill="#FB7185"/>
    </g>

    <!-- Ears -->
    <path d="M 85 110 C 55 90, 45 140, 75 175 C 88 190, 105 155, 105 130 Z" fill="#3D2E2C"/>
    <path d="M 235 110 C 265 90, 275 140, 245 175 C 232 190, 215 155, 215 130 Z" fill="#3D2E2C"/>

    <!-- Head -->
    <ellipse cx="160" cy="170" rx="85" ry="78" fill="url(#pugBody2)"/>

    <!-- Forehead Wrinkles -->
    <path d="M 135 125 Q 160 118 185 125" stroke="#D3B8AA" stroke-width="4" stroke-linecap="round" fill="none"/>
    <path d="M 142 112 Q 160 108 178 112" stroke="#D3B8AA" stroke-width="3" stroke-linecap="round" fill="none"/>

    <!-- Intense Blushing Cheeks -->
    <circle cx="98" cy="205" r="26" fill="url(#blush2)"/>
    <circle cx="222" cy="205" r="26" fill="url(#blush2)"/>

    <!-- Dark Muzzle Base -->
    <ellipse cx="160" cy="206" rx="55" ry="42" fill="url(#pugMuzzle2)"/>

    <!-- Nose -->
    <path d="M 148 188 C 148 184, 172 184, 172 188 C 172 196, 164 202, 160 202 C 156 202, 148 196, 148 188 Z" fill="#1C1413"/>

    <!-- Huge Joyful Open Mouth & Tongue -->
    <path d="M 140 208 Q 160 245 180 208 Z" fill="#E11D48"/>
    <path d="M 148 214 Q 160 242 172 214 Z" fill="#FB7185"/>

    <!-- Big Wide Astonished Happy Eyes with Tears of Joy 🥹 -->
    <!-- Left Eye -->
    <ellipse cx="118" cy="160" rx="20" ry="22" fill="#201514"/>
    <circle cx="112" cy="154" r="8" fill="#FFFFFF"/>
    <circle cx="124" cy="167" r="4" fill="#FFFFFF" opacity="0.9"/>
    <!-- Tear of joy (glittering) -->
    <g class="tear" transform="translate(100, 178)">
      <path d="M 0 0 C -4 4, -4 10, 0 14 C 4 10, 4 4, 0 0 Z" fill="#38BDF8"/>
      <circle cx="-1" cy="9" r="1.5" fill="#FFFFFF"/>
    </g>

    <!-- Right Eye -->
    <ellipse cx="202" cy="160" rx="20" ry="22" fill="#201514"/>
    <circle cx="196" cy="154" r="8" fill="#FFFFFF"/>
    <circle cx="208" cy="167" r="4" fill="#FFFFFF" opacity="0.9"/>
    <!-- Tear of joy -->
    <g class="tear" transform="translate(220, 178)">
      <path d="M 0 0 C -4 4, -4 10, 0 14 C 4 10, 4 4, 0 0 Z" fill="#38BDF8"/>
      <circle cx="-1" cy="9" r="1.5" fill="#FFFFFF"/>
    </g>

    <!-- Party Hat On Top! -->
    <g transform="translate(160, 96)">
      <!-- Hat cone -->
      <polygon points="0,-48 -32,15 32,15" fill="url(#partyHatGrad)"/>
      <!-- Hat stripes -->
      <path d="M -10 -15 L 14 -10" stroke="#FDE047" stroke-width="4" stroke-linecap="round"/>
      <path d="M -20 2 L 24 6" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
      <!-- Fluffy pompom on top -->
      <circle cx="0" cy="-50" r="9" fill="#FDE047"/>
      <circle cx="0" cy="-50" r="5" fill="#FEF08A"/>
    </g>

    <!-- Bowtie -->
    <g transform="translate(160, 260)">
      <polygon points="-24,-12 -24,12 0,0" fill="#F43F5E"/>
      <polygon points="24,-12 24,12 0,0" fill="#F43F5E"/>
      <circle cx="0" cy="0" r="7" fill="#FBBF24"/>
    </g>
  </g>
</svg>
