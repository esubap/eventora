<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="cyberCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>
    <linearGradient id="neonPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fcd34d" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Circle with Neon Border -->
  <circle cx="200" cy="200" r="190" fill="url(#bgGrad)" stroke="url(#cyberCyan)" stroke-width="3" />
  <circle cx="200" cy="200" r="175" fill="none" stroke="url(#neonPurple)" stroke-width="1.5" stroke-dasharray="8 6" opacity="0.7" />

  <!-- Background Matrix / Tech Grid Lines -->
  <path d="M 50 150 L 350 150 M 50 250 L 350 250 M 150 50 L 150 350 M 250 50 L 250 350" stroke="#38bdf8" stroke-width="0.75" opacity="0.15" />
  
  <!-- Cyber Nodes -->
  <circle cx="150" cy="150" r="4" fill="#00f2fe" opacity="0.6" />
  <circle cx="250" cy="150" r="4" fill="#a855f7" opacity="0.6" />
  <circle cx="150" cy="250" r="4" fill="#a855f7" opacity="0.6" />
  <circle cx="250" cy="250" r="4" fill="#00f2fe" opacity="0.6" />

  <!-- Developer Silhouette / Stylized Avatar -->
  <!-- Shoulders & Hoodie -->
  <path d="M 90 380 C 90 300, 130 270, 200 270 C 270 270, 310 300, 310 380 Z" fill="#1e293b" />
  <path d="M 120 380 C 130 320, 160 290, 200 290 C 240 290, 270 320, 280 380 Z" fill="#0f172a" />
  <!-- Hoodie Zipper / Cyber Accent Lines -->
  <path d="M 200 290 L 200 380" stroke="url(#cyberCyan)" stroke-width="3" stroke-linecap="round" />
  <path d="M 175 310 L 185 380" stroke="url(#neonPurple)" stroke-width="1.5" opacity="0.5" />
  <path d="M 225 310 L 215 380" stroke="url(#neonPurple)" stroke-width="1.5" opacity="0.5" />

  <!-- Neck -->
  <rect x="180" y="220" width="40" height="60" rx="8" fill="#e2e8f0" />

  <!-- Head Base -->
  <ellipse cx="200" cy="180" rx="65" ry="75" fill="#f8fafc" />

  <!-- Stylized Hair -->
  <path d="M 130 170 C 125 100, 180 80, 220 85 C 265 90, 275 125, 270 170 C 255 140, 240 135, 200 135 C 160 135, 145 155, 130 170 Z" fill="#0f172a" />
  <path d="M 140 130 Q 180 90 230 105" stroke="url(#cyberCyan)" stroke-width="2.5" fill="none" opacity="0.8" />

  <!-- Cyber Visor / High-Tech Smart Glasses -->
  <rect x="145" y="155" width="110" height="30" rx="6" fill="#030712" stroke="url(#cyberCyan)" stroke-width="2" />
  <path d="M 150 170 L 250 170" stroke="url(#cyberCyan)" stroke-width="2" filter="url(#glow)" />
  <circle cx="165" cy="170" r="3" fill="#ffffff" />
  <circle cx="235" cy="170" r="3" fill="#ffffff" />
  <line x1="185" y1="162" x2="215" y2="162" stroke="#38bdf8" stroke-width="1.5" opacity="0.7" />

  <!-- Modern Headphones -->
  <path d="M 130 140 A 75 75 0 0 1 270 140" fill="none" stroke="#334155" stroke-width="10" stroke-linecap="round" />
  <rect x="120" y="150" width="18" height="50" rx="9" fill="url(#cyberCyan)" />
  <rect x="262" y="150" width="18" height="50" rx="9" fill="url(#neonPurple)" />

  <!-- Floating Tech Symbols -->
  <!-- Code Symbol Left -->
  <g transform="translate(45, 100) scale(0.9)">
    <rect width="45" height="45" rx="10" fill="#090d16" stroke="#00f2fe" stroke-width="1.5" />
    <text x="22" y="28" font-family="monospace" font-size="18" font-weight="bold" fill="#00f2fe" text-anchor="middle">&lt;/&gt;</text>
  </g>

  <!-- AI / Brain Chip Right -->
  <g transform="translate(310, 100) scale(0.9)">
    <rect width="45" height="45" rx="10" fill="#090d16" stroke="#a855f7" stroke-width="1.5" />
    <circle cx="22" cy="22" r="8" fill="none" stroke="#a855f7" stroke-width="1.5" />
    <circle cx="22" cy="22" r="3" fill="#a855f7" />
    <path d="M 22 8 L 22 14 M 22 30 L 22 36 M 8 22 L 14 22 M 30 22 L 36 22" stroke="#a855f7" stroke-width="1.5" />
  </g>

  <!-- Cyber Shield Bottom Left -->
  <g transform="translate(45, 270) scale(0.9)">
    <rect width="45" height="45" rx="10" fill="#090d16" stroke="#10b981" stroke-width="1.5" />
    <path d="M 22 12 L 32 17 V 26 C 32 31 22 35 22 35 C 22 35 12 31 12 26 V 17 Z" fill="none" stroke="#10b981" stroke-width="1.8" />
  </g>

  <!-- Network Sockets Bottom Right -->
  <g transform="translate(310, 270) scale(0.9)">
    <rect width="45" height="45" rx="10" fill="#090d16" stroke="#f59e0b" stroke-width="1.5" />
    <circle cx="15" cy="18" r="4" fill="#f59e0b" />
    <circle cx="30" cy="18" r="4" fill="#f59e0b" />
    <circle cx="22" cy="30" r="4" fill="#f59e0b" />
    <path d="M 15 18 L 30 18 L 22 30 Z" stroke="#f59e0b" stroke-width="1" fill="none" />
  </g>
</svg>
